<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quiz App</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.quiz-box{
background:white;
padding:20px;
max-width:500px;
margin:auto;
border-radius:10px;
}

button{
display:block;
margin:10px 0;
padding:10px;
width:100%;
cursor:pointer;
}

#nextBtn{
background:blue;
color:white;
}
</style>
</head>

<body>

<div class="quiz-box">

<h2 id="question">Question Here</h2>

<div id="answers"></div>

<button id="nextBtn">Next</button>

</div>

<script>

const quiz = [

{
question:"ශ්‍රී ලංකාවේ අගනුවර කුමක්ද?",
answers:["කොළඹ","මහනුවර","ගාල්ල","යාපනය"],
correct:0
},

{
question:"2 + 2 = ?",
answers:["3","4","5","6"],
correct:1
},

{
question:"ලෝකයේ විශාලතම සාගරය?",
answers:["ඉන්දීය","අත්ලාන්තික්","පැසිෆික්","ආක්ටික්"],
correct:2
}

];

let currentQuestion = 0;
let score = 0;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");

function loadQuestion(){

answersEl.innerHTML="";

let q = quiz[currentQuestion];

questionEl.innerText = q.question;

q.answers.forEach((answer,index)=>{

let btn = document.createElement("button");

btn.innerText = answer;

btn.onclick = ()=>{

if(index === q.correct){
score++;
}

nextBtn.style.display="block";

};

answersEl.appendChild(btn);

});

}

nextBtn.onclick = ()=>{

currentQuestion++;

if(currentQuestion < quiz.length){

loadQuestion();

}else{

document.querySelector(".quiz-box").innerHTML =
"<h1>ඔබගේ ලකුණු: " + score + "/" + quiz.length + "</h1>";

}

};

loadQuestion();

</script>

</body>
</html>
